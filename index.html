<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apurva Bridal Lehanga &amp; Sarees — Khetan Super Market, Patna</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Instant Hero LCP Preloads: Discovered by browser pre-scanner before JS executes -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-showroom-mobile.webp"
      media="(max-width: 768px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-showroom-desktop.webp"
      media="(min-width: 769px)"
      fetchpriority="high"
    />
  </head>
  <body class="bg-white text-neutral-950 antialiased selection:bg-[#8B1E2B] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
